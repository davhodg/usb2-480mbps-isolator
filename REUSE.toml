version = 1
SPDX-PackageName = "usb2-480mbps-isolator"
SPDX-PackageDownloadLocation = "https://github.com/davhodg/usb2-480mbps-isolator"

# Default: everything is hardware design documentation under CERN-OHL-S-2.0.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 davhodg"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Firmware for the CC/CDP-detect MCU is Apache-2.0. When several annotations match, the last one wins;
# a file's own SPDX header takes priority over both ("closest", the default).
[[annotations]]
path = "firmware/**"
SPDX-FileCopyrightText = "2026 davhodg"
SPDX-License-Identifier = "Apache-2.0"

# The code of conduct is adapted from the Contributor Covenant 2.1, under CC-BY-4.0.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"
